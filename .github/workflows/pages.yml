name: Publier le site sur GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Vérifier le parcours
        run: |
          node scripts/build-site.cjs
          node --check formations.js
          node --check script.js
          node --check programme-core.js
          node --check programme.js
          node --test tests/programme.test.cjs
          node scripts/verify-site.cjs
      - uses: actions/configure-pages@v5
      - name: Préparer le site
        run: |
          mkdir _site
          cp index.html site.css formations.js script.js programme-core.js programme.js sitemap.xml robots.txt 404.html _site/
          cp -r formations assets _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4
